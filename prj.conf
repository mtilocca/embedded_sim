# C++ (no exceptions/RTTI, no heap use in sim code)
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096

# Enabled simulations (override per board in boards/<board>.conf)
CONFIG_SIM_SENSORS=y

# HTTP server: a browser opens several parallel keep-alive connections and the
# WebSocket holds one slot for good. With the default of 3 slots, a few idle
# connections lock everyone else out until the inactivity timeout.
CONFIG_HTTP_SERVER_MAX_CLIENTS=6
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=3

# WebSocket viewers. Zephyr's default is ONE websocket system-wide, so a second
# browser/device got the upgrade and was closed at once (UI loaded, no data).
# Keep contexts > viewers: eviction in net/ws/ws.cpp then always has room to run.
CONFIG_WEBSOCKET_MAX_CONTEXTS=8
CONFIG_SIM_WS_MAX_CLIENTS=4
