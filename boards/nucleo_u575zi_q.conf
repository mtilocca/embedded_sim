# STM32U575: Wi-Fi via X-NUCLEO-67W61M1 shield (ST67W611M1), -DSHIELD set in scripts/build.sh
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT_INFO=y
# static IP (see Kconfig SIM_STATIC_IPV4); DHCP off
CONFIG_NET_DHCPV4=n
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16

CONFIG_SIM_WEBSERVER=y
CONFIG_SIM_WIFI=y
CONFIG_SIM_MQTT=y
CONFIG_SIM_STATIC_IPV4="192.168.1.45"

# ST67W611M1 driver (from zephyr samples/net/zperf/boards/x_nucleo_67w61m1.conf)
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=6000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=32
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SIM_DEVICE_ID="stm32-01"

# HTTP server + WebSocket UI
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_ZVFS_POLL_MAX=16
