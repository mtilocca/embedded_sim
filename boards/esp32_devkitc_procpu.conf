# ESP32: native Wi-Fi
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT_INFO=y
# static IP (see Kconfig SIM_STATIC_IPV4); DHCP off
CONFIG_NET_DHCPV4=n
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y

CONFIG_SIM_WEBSERVER=y
CONFIG_SIM_WIFI=y
CONFIG_SIM_MQTT=y
CONFIG_SIM_STATIC_IPV4="192.168.1.44"
CONFIG_SIM_DEVICE_ID="esp32-01"

# HTTP server + WebSocket UI
CONFIG_ZVFS_POLL_MAX=16

# ESP32 DRAM is only ~192 KB: keep the HTTP server lean.
# (Frontend files must stay `const` in net/ws/service.c so they live in flash, not RAM.)
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_MAX_STREAMS=2

# Real-time HIL node: never sleep the radio (modem sleep drops ARP/TCP, board looks "offline")
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
